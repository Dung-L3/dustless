name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.3"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
      - name: Smoke test the compiled binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=./dist/dustless.exe; else BIN=./dist/dustless; fi
          $BIN --version
          $BIN scan --json
          $BIN rule list --json
          $BIN doctor || true

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Repository policy
        run: bun scripts/check-repo.ts

  swift:
    name: swift (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Swift unit tests
        working-directory: apps/dustless-mac
        run: swift test

  macos-build:
    name: macos-build (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Build the app bundle
        run: bun run bundle:mac
      - name: The bundle must carry a working engine
        run: |
          codesign --verify --deep dist/Dustless.app
          dist/Dustless.app/Contents/Resources/dustless version
          test -x dist/Dustless.app/Contents/MacOS/Dustless

  ui:
    name: ui (macos, advisory)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:ui
