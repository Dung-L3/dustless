name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.3"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
      - name: Smoke test the compiled binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=./dist/dustless.exe; else BIN=./dist/dustless; fi
          $BIN --version
          $BIN scan --json
          $BIN rule list --json
          $BIN doctor || true

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Repository policy
        run: bun scripts/check-repo.ts

  swift:
    name: swift (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Swift unit tests
        working-directory: apps/dustless-mac
        run: swift test

  macos-build:
    name: macos-build (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Build the app bundle
        run: bun run bundle:mac
      - name: The bundle must carry a working engine
        run: |
          codesign --verify --deep dist/Dustless.app
          dist/Dustless.app/Contents/Resources/dustless version
          test -x dist/Dustless.app/Contents/MacOS/Dustless
      - name: Free the space the image needs
        run: |
          rm -rf apps/dustless-mac/.build
          rm -f dist/dustless
          df -h /
      - name: Build the disk image
        run: |
          df -h / /System/Volumes/Data
          echo "=== diskimages2 helper state ==="
          hdiutil info | head -25
          echo "=== minimal scratch create (no -srcfolder) ==="
          rm -f /tmp/diag.dmg
          hdiutil create -volname Diag -size 5m -format UDRW /tmp/diag.dmg 2>&1 | tail -2
          if [ -f /tmp/diag.dmg ]; then
            echo "minimal create SUCCEEDED: $(stat -f%z /tmp/diag.dmg) bytes"
            hdiutil imageinfo /tmp/diag.dmg 2>&1 | head -4
          else
            echo "minimal create FAILED too: the create path itself is broken on this runner"
          fi
          echo "=== mounted volumes ==="
          mount | grep -c "on /Volumes" || true
          bun run dmg
      - name: The image must hold the app and the Applications link
        run: |
          hdiutil attach dist/Dustless-*.dmg -nobrowse -readonly
          ls -R /Volumes/Dustless
          test -d /Volumes/Dustless/Dustless.app
          test -L /Volumes/Dustless/Applications
          hdiutil detach /Volumes/Dustless

  ui:
    name: ui (macos, advisory)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:ui

  ui-render:
    name: ui-render (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Swift tests, including the off-screen render suite
        working-directory: apps/dustless-mac
        run: swift test
      - name: The render suite must have drawn every screen
        if: always()
        run: |
          test -d artifacts/ui-render
          count=$(ls artifacts/ui-render/*.png | wc -l)
          test "$count" -ge 50
      - name: Upload the rendered screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-render
          path: artifacts/ui-render
          if-no-files-found: error
          retention-days: 14
