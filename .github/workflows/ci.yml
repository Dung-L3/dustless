name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.3"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
      - name: Smoke test the compiled binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=./dist/dustless.exe; else BIN=./dist/dustless; fi
          $BIN --version
          $BIN scan --json
          $BIN rule list --json
          $BIN doctor || true

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Repository policy
        run: bun scripts/check-repo.ts

  swift:
    name: swift (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Swift unit tests
        working-directory: apps/dustless-mac
        run: swift test

  macos-build:
    name: macos-build (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Build the app bundle
        run: bun run bundle:mac
      - name: The bundle must carry a working engine
        run: |
          codesign --verify --deep dist/Dustless.app
          dist/Dustless.app/Contents/Resources/dustless version
          test -x dist/Dustless.app/Contents/MacOS/Dustless
      - name: Free the space the image needs
        run: |
          rm -rf apps/dustless-mac/.build
          rm -f dist/dustless
          df -h /
      - name: Free the diskimage slots the boot image spends on simulator runtimes
        run: |
          # The runner boots with simulator runtime cryptexes attached. Their blocks in
          # hdiutil info carry plain /dev/diskN lines (no "dev-entry" label in the
          # DiskImages2 output), so take the top-level device of each simulator runtime
          # image and detach it: this job uses no simulator. Measured in docs/DECISIONS.md 151.
          sudo -n true || exit 0
          hdiutil info | awk '
            /^image-path/ { path=$NF }
            /^[[:space:]]*\/dev\/disk[0-9]+([[:space:]]|$)/ { print path, $1 }
          ' | grep -i SimulatorRuntime | awk '!seen[$2]++' | while read -r path dev; do
            if sudo hdiutil detach -force "$dev" >/dev/null 2>&1; then
              echo "detached $dev ($path)"
            else
              echo "detach of $dev failed (kept: $path)"
            fi
          done
          echo "attached images after cleanup: $(hdiutil info | sed -n '3p')"

      - name: Build the disk image
        run: |
          df -h / /System/Volumes/Data
          echo "attached images before the build: $(hdiutil info | sed -n '3p')"
          bun run dmg
      - name: The image must hold the app and the Applications link
        run: |
          dev=$(sudo hdiutil attach dist/Dustless-*.dmg -nobrowse -nomount | awk '/Apple_HFS/ {print $1; exit}')
          test -n "$dev" || { echo "attach -nomount printed no Apple_HFS device"; exit 1; }
          echo "attached $dev"
          mountpoint=$(mktemp -d /tmp/dmg-verify-XXXX)
          sudo mount -r -t hfs "$dev" "$mountpoint"
          ls -R "$mountpoint"
          test -d "$mountpoint/Dustless.app"
          test -L "$mountpoint/Applications"
          test "$(readlink "$mountpoint/Applications")" = "/Applications"
          version=$("$mountpoint/Dustless.app/Contents/Resources/dustless" version)
          pkg_version=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          test "$version" = "$pkg_version"
          echo "the image holds Dustless.app $version and the Applications link"
          sudo umount "$mountpoint"
          rm -rf "$mountpoint"
          hdiutil detach "$dev"

  ui:
    name: ui (macos, advisory)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:ui

  ui-render:
    name: ui-render (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Swift tests, including the off-screen render suite
        working-directory: apps/dustless-mac
        run: swift test
      - name: The render suite must have drawn every screen
        if: always()
        run: |
          test -d artifacts/ui-render
          count=$(ls artifacts/ui-render/*.png | wc -l)
          test "$count" -ge 50
      - name: Upload the rendered screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-render
          path: artifacts/ui-render
          if-no-files-found: error
          retention-days: 14
