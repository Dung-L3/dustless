name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            out: dustless-macos-arm64
            target: bun-darwin-arm64
          - os: macos-latest
            out: dustless-macos-x64
            target: bun-darwin-x64
          - os: ubuntu-latest
            out: dustless-linux-x64
            target: bun-linux-x64
          - os: windows-latest
            out: dustless-windows-x64.exe
            target: bun-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
        env:
          OUTFILE: dist/${{ matrix.out }}
          BUN_TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect every built binary
        run: |
          mkdir -p out
          find artifacts -type f -name 'dustless*' -exec cp {} out/ \;
          ls -l out
          test "$(find out -type f | wc -l)" -eq 4

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: out/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}