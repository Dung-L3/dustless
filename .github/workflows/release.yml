name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.5.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.3"

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}" "refs/tags/$TAG" > /dev/null
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: The tag, the package and the docs must agree
        run: bun scripts/check-release.ts "${{ steps.resolve.outputs.tag }}"
      - name: No other copy of the version may drift
        run: bun scripts/check-release-artifacts.ts "${{ steps.resolve.outputs.tag }}"

  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      macos_signed: ${{ steps.check.outputs.macos_signed }}
    steps:
      - id: check
        env:
          SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          set -eu
          signed=0
          notary=0
          if [ -n "$SIGNING_CERT" ] && [ -n "$SIGNING_CERT_PASSWORD" ]; then signed=1; fi
          if [ -n "$NOTARY_PROFILE" ]; then notary=1; fi
          if [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_KEY" ] && [ -n "$NOTARY_ISSUER_ID" ]; then notary=1; fi
          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then notary=1; fi
          if [ "$signed" = "1" ] && [ "$notary" != "1" ]; then
            echo "::error::A Developer ID certificate is configured but the notary credentials are missing. Set MACOS_NOTARY_KEY_ID, MACOS_NOTARY_KEY and MACOS_NOTARY_ISSUER_ID, or MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_PASSWORD and MACOS_NOTARY_TEAM_ID, or MACOS_NOTARY_PROFILE. A signed but un-notarised app is never published."
            exit 1
          fi
          if [ "$signed" = "1" ]; then echo "macos_signed=1" >> "$GITHUB_OUTPUT"; else echo "macos_signed=0" >> "$GITHUB_OUTPUT"; fi

  build:
    name: build (${{ matrix.out }})
    needs: [guard, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            out: dustless-macos-arm64
            target: bun-darwin-arm64
            run: ./dist/dustless-macos-arm64
          - os: macos-latest
            out: dustless-macos-x64
            target: bun-darwin-x64
            run: arch -x86_64 ./dist/dustless-macos-x64
          - os: ubuntu-latest
            out: dustless-linux-x64
            target: bun-linux-x64
            run: ./dist/dustless-linux-x64
          - os: windows-latest
            out: dustless-windows-x64.exe
            target: bun-windows-x64
            run: ./dist/dustless-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
        env:
          OUTFILE: dist/${{ matrix.out }}
          BUN_TARGET: ${{ matrix.target }}
      - name: Smoke test the artifact that will be published
        shell: bash
        run: |
          ${{ matrix.run }} --version
          test "$(${{ matrix.run }} version)" = "${{ needs.guard.outputs.version }}"
          ${{ matrix.run }} scan --json > /dev/null
          ${{ matrix.run }} rule list --json > /dev/null
          ${{ matrix.run }} doctor || true
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error

  bundle-macos:
    name: bundle-macos (macos)
    needs: [guard, prepare, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Take the engine that will be published
        uses: actions/download-artifact@v4
        with:
          name: dustless-macos-arm64
          path: dist/release-engine
      - name: Free the diskimage slots the boot image spends on simulator runtimes
        run: |
          # The runner boots with simulator runtime cryptexes attached; when the
          # diskimages2 helper has no free slot the dmg create fails with
          # "No space left on device". This job uses no simulator. See docs/DECISIONS.md 151.
          sudo -n true || exit 0
          hdiutil info | awk '
            /image-path/ { path=$NF }
            /dev-entry/  { print path, $NF }
          ' | grep -i SimulatorRuntime | while read -r path dev; do
            sudo hdiutil detach -force "$dev" >/dev/null 2>&1 && echo "detached $dev"
          done
          echo "attached images after cleanup: $(hdiutil info | sed -n '3p')"

      - name: Build the app bundle and the disk image
        run: |
          bun run bundle:mac
          bun run dmg
        env:
          DUSTLESS_ENGINE: dist/release-engine/dustless-macos-arm64
      - name: The bundle must carry a working engine
        run: |
          codesign --verify --deep dist/Dustless.app
          dist/Dustless.app/Contents/Resources/dustless version
          test "$(dist/Dustless.app/Contents/Resources/dustless version)" = "${{ needs.guard.outputs.version }}"
      - name: Every version must agree
        env:
          DUSTLESS_ENGINE: dist/release-engine/dustless-macos-arm64
        run: bun scripts/check-release-artifacts.ts "${{ needs.guard.outputs.tag }}" --artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: dustless-macos-unsigned
          path: |
            dist/Dustless-*.dmg
            dist/macos-release.json
          if-no-files-found: error

  sign-macos:
    name: sign-macos (macos)
    needs: [guard, prepare, build]
    if: needs.prepare.outputs.macos_signed == '1'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Take the engine that will be published
        uses: actions/download-artifact@v4
        with:
          name: dustless-macos-arm64
          path: dist/release-engine
      - name: Free the diskimage slots the boot image spends on simulator runtimes
        run: |
          # Same rationale as in bundle-macos (docs/DECISIONS.md 151).
          sudo -n true || exit 0
          hdiutil info | awk '
            /image-path/ { path=$NF }
            /dev-entry/  { print path, $NF }
          ' | grep -i SimulatorRuntime | while read -r path dev; do
            sudo hdiutil detach -force "$dev" >/dev/null 2>&1 && echo "detached $dev"
          done

      - name: Build the app bundle with the Developer ID and the disk image
        env:
          DUSTLESS_ENGINE: dist/release-engine/dustless-macos-arm64
          DUSTLESS_SIGN_MODE: developer-id
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          bun run bundle:mac
          bun run dmg
      - name: Notarise the image and staple the ticket
        env:
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: bun scripts/notarize-macos.ts
      - name: Gatekeeper must accept the app
        run: |
          codesign --verify --deep --strict dist/Dustless.app
          xcrun stapler validate dist/Dustless.app
          xcrun stapler validate dist/Dustless-*.dmg
          spctl -a -t exec -v dist/Dustless.app
          test "$(dist/Dustless.app/Contents/Resources/dustless version)" = "${{ needs.guard.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: dustless-macos-app
          path: |
            dist/Dustless-*.dmg
            dist/macos-release.json
          if-no-files-found: error

  bundle-windows:
    name: bundle-windows (windows)
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Make sure the archiving tool is on the runner
        shell: pwsh
        run: |
          if (-not (Get-Command zip -ErrorAction SilentlyContinue)) {
            Write-Host "zip is not preinstalled; installing it with Chocolatey"
            choco install zip -y --no-progress
          }
          $zip = Get-Command zip -ErrorAction SilentlyContinue
          if (-not $zip) { throw "zip is still missing after the install" }
          Write-Host "zip: $($zip.Source)"

      - name: Locate NSIS
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            Write-Host "NSIS not preinstalled; installing with Chocolatey"
            choco install nsis -y --no-progress
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $found) { throw "makensis not found after install" }
          Write-Host "makensis: $found"
          "MAKENSIS=$found" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build the Windows engine
        env:
          OUTFILE: dist/dustless.exe
          BUN_TARGET: bun-windows-x64
        run: bun run build
      - name: Copy the committed icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/icons | Out-Null
          Copy-Item brand/generated/dustless.ico dist/icons/dustless.ico
      - name: Build the installer and the portable archive
        run: |
          bun run installer:win
          bun run package:win
      - name: Install, run, then uninstall in a throwaway location
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist -Filter "Dustless-*-setup.exe" | Select-Object -First 1).FullName
          if (-not $exe) { throw "installer was not produced" }
          if ((Get-Item $exe).Length -lt 20MB) { throw "installer is suspiciously small" }
          $sig = [System.IO.File]::ReadAllBytes($exe)[0..1]
          if ($sig[0] -ne 0x4D -or $sig[1] -ne 0x5A) { throw "installer is not a Windows PE" }
          $dir = "$env:LOCALAPPDATA\Programs\Dustless"
          Start-Process -FilePath $exe -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          if (-not (Test-Path "$dir\dustless.exe")) { throw "silent install did not place the engine" }
          if (-not (Test-Path "$dir\Uninstall.exe")) { throw "uninstaller was not written" }
          Write-Host "installed engine reports: $(& "$dir\dustless.exe" version)"
          $json = & "$dir\dustless.exe" scan --json
          if ($LASTEXITCODE -ne 0) { throw "scan failed after install" }
          if (-not ($json | ConvertFrom-Json).PSObject.Properties.Name.Contains("findings")) { throw "scan --json has no findings key" }
          Start-Process -FilePath "$dir\Uninstall.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\dustless.exe") { throw "uninstall left the engine behind" }
      - uses: actions/upload-artifact@v7
        with:
          name: dustless-windows
          path: |
            dist/Dustless-*-setup.exe
            dist/dustless-*-windows-x64.zip
          if-no-files-found: error

  checksums:
    name: checksums
    needs: [guard, build, bundle-macos, bundle-windows, sign-macos]
    if: always() && needs.guard.result == 'success' && needs.build.result == 'success' && needs.bundle-macos.result == 'success' && needs.bundle-windows.result == 'success' && (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect every artifact
        run: |
          mkdir -p out
          find artifacts -type f \( -name 'dustless-*' -o -name 'Dustless-*' \) ! -name '*.blockmap' ! -path 'artifacts/dustless-macos-unsigned/*' -exec cp {} out/ \;
          ls -l out
          test "$(find out -type f | wc -l)" -ge 6
      - name: SHA256SUMS
        run: |
          cd out
          sha256sum $(ls | sort) > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: out
          if-no-files-found: error

  release:
    name: release
    needs: [guard, checksums]
    if: always() && needs.guard.result == 'success' && needs.checksums.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: out
      - name: Read what signed the macOS app
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: dustless-macos-app
          path: macos
          if-no-files-found: ignore
      - name: Every published file must have a checksum
        run: |
          cd out
          test -f SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -l
      - name: The published engine must print the released version
        run: |
          chmod +x out/dustless-linux-x64
          test "$(out/dustless-linux-x64 version)" = "${{ needs.guard.outputs.version }}"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.tag }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          notes=$(mktemp)
          printf 'Dustless %s\n\n' "$TAG" > "$notes"
          printf -- '- Engine binaries for macOS, Linux and Windows\n' >> "$notes"
          printf -- '- A per user Windows installer and a portable archive\n' >> "$notes"
          printf -- '- SHA256SUMS for every file\n' >> "$notes"
          record=$(find macos -name macos-release.json -print -quit 2>/dev/null || true)
          if [ -f "out/Dustless-$VERSION.dmg" ]; then
            if [ -z "$record" ] || [ ! -f "$record" ]; then
              echo "::error::the macOS disk image is in the release but the signing record is missing. Refusing to publish an app nobody checked."
              exit 1
            fi
            mode=$(sed -n 's/.*"mode"[^"]*"\([^"]*\)".*/\1/p' "$record")
            notarized=$(sed -n 's/.*"notarized"[^:]*:[[:space:]]*\([a-z]*\).*/\1/p' "$record")
            if [ "$mode" != "developer-id" ] || [ "$notarized" != "true" ]; then
              echo "::error::the macOS app was not notarised (mode $mode, notarized $notarized). Refusing to publish an app macOS refuses to open."
              exit 1
            fi
            printf -- '- The macOS app bundle as a drag to install disk image, signed with a Developer ID and notarised by Apple. Gatekeeper opens it without a warning.\n' >> "$notes"
          else
            printf -- '- No macOS app in this release: the project holds no Apple Developer ID, so the bundle cannot be notarised and macOS would refuse to open it. The command line engine is complete and is what this release ships.\n' >> "$notes"
            printf -- '- The macOS bundle and its disk image are built and checked on every release run. They are published only once they can be notarised.\n' >> "$notes"
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "$notes" --verify-tag out/* || \
          gh release upload "$TAG" --clobber out/*
          gh release view "$TAG" --json tagName,assets --jq '.tagName, (.assets | length)'
