# Dustless rule database
# tier: green = tự tái tạo · yellow = cần quyết định · red = nằm trong danh sách đen tích hợp
# requireVerify: nếu kiểm chứng thất bại, rule bị hạ xuống yellow
# match: regex lọc basename của thư mục con
# paths: key = mac | win | linux | all

- id: gradle.version_cache
  tier: green
  desc: Gradle cache của version không project nào dùng
  paths: { all: "~/.gradle/caches/*" }
  match: '^[0-9]+\.[0-9]+(\.[0-9]+)?$'
  requireVerify: gradle_version_unused
  minAgeDays: 30
  nativeCommand: gradle --stop

- id: gradle.wrapper
  tier: green
  desc: Gradle wrapper đã tải về, tự tải lại khi build
  paths: { all: "~/.gradle/wrapper/dists" }
  minAgeDays: 90

- id: npm.cacache
  tier: green
  desc: npm cache tarball
  paths:
    all: "~/.npm/_cacache"
    win: "%LOCALAPPDATA%/npm-cache"
  nativeCommand: npm cache verify

- id: npm.npx
  tier: green
  desc: Package tải tạm qua npx, tái tạo khi chạy lại
  paths: { all: "~/.npm/_npx" }

- id: pnpm.store
  tier: green
  desc: pnpm content-addressable store
  paths:
    mac: "~/Library/pnpm/store"
    win: "%LOCALAPPDATA%/pnpm/store"
    linux: "~/.local/share/pnpm/store"
  nativeCommand: pnpm store prune

- id: bun.cache
  tier: green
  desc: Bun package cache
  paths: { all: "~/.bun/install/cache" }

- id: uv.cache
  tier: green
  desc: uv cache wheel và source build
  paths: { all: "~/.cache/uv" }
  nativeCommand: uv cache clean

- id: pubcache.hosted
  tier: green
  desc: Dart pub cache, tái tạo bằng pub get
  paths: { all: "~/.pub-cache/hosted" }

- id: homebrew.cache
  tier: green
  desc: Homebrew download cache
  paths:
    mac: ["/opt/homebrew/var/homebrew/cache", "~/Library/Caches/Homebrew"]
    win: ["~/AppData/Local/Homebrew/Cache", "~/scoop/cache"]
    linux: ["~/.cache/Homebrew", "~/.cache/scoop"]

- id: yarn.cache
  tier: green
  desc: Yarn cache
  paths: { all: "~/.cache/yarn" }

- id: pip.cache
  tier: green
  desc: pip wheel cache
  paths: { all: "~/.cache/pip" }

- id: go.modcache
  tier: green
  desc: Go module cache
  paths:
    mac: "~/go/pkg/mod"
    win: "%USERPRO%/go/pkg/mod"
    linux: "~/go/pkg/mod"

- id: cargo.registry
  tier: green
  desc: Cargo registry cache
  paths: { all: "~/.cargo/registry/cache" }

- id: browser.brave
  tier: green
  desc: Brave cache, không đụng profile
  paths: { all: "~/Library/Caches/com.brave.Browser" }
  match: '^(Cache|Code Cache|GPUCache|Service Worker)$'

- id: browser.brave_software
  tier: green
  desc: Brave Software cache
  paths: { all: "~/Library/Caches/BraveSoftware" }

- id: browser.chrome
  tier: green
  desc: Chrome cache, không đụng profile
  paths:
    mac: "~/Library/Caches/Google/Chrome"
    win: "%LOCALAPPDATA%/Google/Chrome/User Data"
    linux: "~/.cache/google-chrome"

- id: browser.firefox
  tier: green
  desc: Firefox cache
  paths: { all: "~/Library/Caches/Firefox/Profiles" }

- id: browser.edge
  tier: green
  desc: Edge cache
  paths:
    mac: "~/Library/Caches/Microsoft Edge"
    win: "%LOCALAPPDATA%/Microsoft/Edge/User Data"

- id: test.puppeteer
  tier: green
  desc: Puppeteer browser tải về
  paths:
    mac: "~/.cache/puppeteer"
    win: "%USERPRO%/.cache/puppeteer"
    linux: "~/.cache/puppeteer"

- id: android.avd
  tier: yellow
  desc: Android emulator AVD, tốn hàng GB mỗi cái
  paths: { all: "~/.android/avd/*.avd" }
  minAgeDays: 30

- id: android.system_images
  tier: yellow
  desc: Ảnh hệ thống Android cho emulator
  paths:
    all: "~/Library/Android/sdk/system-images"
    win: "%LOCALAPPDATA%/Android/Sdk/system-images"
    linux: "~/Android/Sdk/system-images"
  minAgeDays: 90

- id: android.ndk
  tier: yellow
  desc: Android NDK, build native cần đúng phiên bản
  paths:
    all: "~/Library/Android/sdk/ndk"
    win: "%LOCALAPPDATA%/Android/Sdk/ndk"
    linux: "~/Android/Sdk/ndk"
  minAgeDays: 90

- id: container.colima
  tier: yellow
  desc: Colima VM disk, xoá là mất image và container
  paths: { all: "~/.colima/_lima" }
  minAgeDays: 60

- id: container.docker
  tier: yellow
  desc: Docker Desktop VM disk
  paths: { mac: "~/Library/Containers/com.docker.docker" }

- id: project.node_modules
  tier: yellow
  desc: node_modules của project, bỏ qua nếu git còn thay đổi chưa commit
  paths:
    all: ["~/*/*/node_modules", "~/*/node_modules", "~/*/*/*/node_modules"]
  requireVerify: git_clean
  minAgeDays: 30

- id: project.build
  tier: yellow
  desc: Build output của project, tái tạo được nhưng build lâu
  paths:
    all: ["~/*/*/build", "~/*/build", "~/*/*/*/build"]
  minAgeDays: 30