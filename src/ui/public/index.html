<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Dustless — safe disk cleanup for developer machines." />
    <title>Dustless</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a0b0e'/%3E%3Cpath d='M9 20.5 15 26l8-13' fill='none' stroke='%237df9c3' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-mark" viewBox="0 0 24 24">
        <path
          d="M4 15.5 9.5 21 20 7"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="i-leaf" viewBox="0 0 24 24">
        <path
          d="M12 3c5.5 2.5 7 7.5 7 11.5a7.5 7.5 0 0 1-7 7.5 7.5 7.5 0 0 1-7-7.5C5 8 7.5 4 12 3z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path d="M12 7v10.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-green" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path
          d="m8 12.2 2.7 2.7L16 9.4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="i-yellow" viewBox="0 0 24 24">
        <path
          d="M12 3.6 21.2 20H2.8z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
        <path d="M12 9.6v4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="12" cy="16.8" r="1.05" fill="currentColor" />
      </symbol>
      <symbol id="i-blocked" viewBox="0 0 24 24">
        <path
          d="M8.3 3h7.4L21 8.3v7.4L15.7 21H8.3L3 15.7V8.3z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
        <path d="m9.2 9.2 5.6 5.6M14.8 9.2l-5.6 5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-scan" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6" />
        <circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M12 12 19 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </symbol>
      <symbol id="i-broom" viewBox="0 0 24 24">
        <path
          d="M14.5 3.2 20.8 9.5M17.6 6.3 9.9 14l-.6 5.3-5.3.6L10.1 14z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path
          d="M5 12h13m-5.5-5.5L18 12l-5.5 5.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="10.5" width="14" height="9.5" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M8.6 10.5V8a3.4 3.4 0 0 1 6.8 0v2.5" fill="none" stroke="currentColor" stroke-width="1.7" />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M12 2v2m0 16v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M2 12h2m16 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
    </svg>

    <a class="skip" href="#tabPanels" data-i18n="skipToFindings">Skip to findings</a>

    <header class="island">
      <div class="island__brand">
        <span class="island__mark"><svg aria-hidden="true"><use href="#i-leaf" /></svg></span>
        <span class="island__name">Dustless</span>
      </div>
      <div class="island__stats" aria-live="polite">
        <span id="freeStat" class="stat">—</span>
        <span class="stat__sep" aria-hidden="true"></span>
        <span id="selectStat" class="stat">—</span>
      </div>
      <div class="island__tools">
        <button type="button" class="icon" id="themeBtn" aria-label="Theme" title="Theme">
          <svg aria-hidden="true"><use href="#i-sun" /></svg>
        </button>
        <button type="button" class="ghost" id="scanBtn" data-busy="false">
          <svg aria-hidden="true" class="ghost__icon"><use href="#i-scan" /></svg>
          <span data-i18n="rescan">Rescan</span>
        </button>
        <div class="langs" id="langs" role="group" aria-label="Language">
          <button type="button" class="lang" data-lang="vi" aria-pressed="false">VI</button>
          <button type="button" class="lang" data-lang="en" aria-pressed="false">EN</button>
          <button type="button" class="lang" data-lang="zh" aria-pressed="false">中文</button>
        </div>
      </div>
    </header>

    <main class="shell">
      <section class="hero" aria-labelledby="heroTitle">
        <div class="bezel">
          <div class="core core--figure">
            <p class="eyebrow" data-i18n="eyebrow">—</p>
            <h1 class="figure" id="heroTitle">
              <span class="figure__label" data-i18n="reclaimable">—</span>
              <span class="figure__value">
                <span id="reclaimValue">0</span><span class="figure__unit" id="reclaimUnit">GB</span>
              </span>
            </h1>
            <div class="meter" role="img" id="diskMeter" aria-label="Free space">
              <span class="meter__fill" id="diskFill"></span>
            </div>
            <p class="figure__foot">
              <span class="figure__free"><span data-i18n="freeSpace">—</span>: <b id="freeValue">—</b></span>
              <span class="figure__sep" aria-hidden="true"></span>
              <span><span data-i18n="freeMeter">—</span> <b id="usedPercent">—</b></span>
            </p>
          </div>
        </div>

        <div class="bezel bezel--act">
          <div class="core core--act">
            <button type="button" class="cta" id="cleanBtn" disabled>
              <span class="cta__body">
                <span class="cta__label" data-i18n="cleanNow">—</span>
                <span class="cta__hint" id="cleanHint">—</span>
              </span>
              <span class="cta__icon"><svg aria-hidden="true"><use href="#i-arrow" /></svg></span>
            </button>
            <ul class="safety">
              <li><svg aria-hidden="true"><use href="#i-lock" /></svg><span data-i18n="safetyReadOnly">—</span></li>
              <li><svg aria-hidden="true"><use href="#i-blocked" /></svg><span data-i18n="safetyRed">—</span></li>
              <li><svg aria-hidden="true"><use href="#i-mark" /></svg><span data-i18n="safetyMeasured">—</span></li>
            </ul>
          </div>
        </div>
      </section>

      <section class="tiers" id="tiers" aria-label="Risk tabs">
        <div class="tabs" role="tablist" id="tablist" aria-label="Risk">
          <button
            type="button"
            class="tab"
            role="tab"
            id="tabSafeBtn"
            aria-controls="tabSafe"
            data-tab="safe"
            data-tier="green"
            aria-selected="true"
          >
            <span class="tab__glyph"><svg aria-hidden="true"><use href="#i-green" /></svg></span>
            <span class="tab__text">
              <span class="tab__name" data-i18n="safeTab">—</span>
              <span class="tab__meta"><b id="greenCount">0</b><span id="greenSize">0 GB</span></span>
            </span>
          </button>
          <button
            type="button"
            class="tab"
            role="tab"
            id="tabReviewBtn"
            aria-controls="tabReview"
            data-tab="review"
            data-tier="yellow"
            aria-selected="false"
          >
            <span class="tab__glyph"><svg aria-hidden="true"><use href="#i-yellow" /></svg></span>
            <span class="tab__text">
              <span class="tab__name" data-i18n="reviewTab">—</span>
              <span class="tab__meta"><b id="yellowCount">0</b><span id="yellowSize">0 GB</span></span>
            </span>
          </button>
          <button
            type="button"
            class="tab"
            role="tab"
            id="tabLockedBtn"
            aria-controls="tabLocked"
            data-tab="locked"
            data-tier="blocked"
            aria-selected="false"
          >
            <span class="tab__glyph"><svg aria-hidden="true"><use href="#i-blocked" /></svg></span>
            <span class="tab__text">
              <span class="tab__name" data-i18n="lockedTab">—</span>
              <span class="tab__meta"><b id="blockedCount">0</b><span id="blockedSize">0 GB</span></span>
            </span>
          </button>
        </div>

        <div class="tab-panels" id="tabPanels">
          <div id="tabSafe" class="tab-panel" role="tabpanel" aria-labelledby="tabSafeBtn">
            <div class="panel__head">
              <h2 class="panel__title" data-i18n="safeTab">—</h2>
              <p class="panel__meta" id="safeMeta">—</p>
            </div>
            <div class="groups" data-tab-group="safe"></div>
            <div class="tab-empty" id="safeEmpty" hidden>
              <p data-i18n="emptySafe">—</p>
            </div>
          </div>
          <div id="tabReview" class="tab-panel" role="tabpanel" aria-labelledby="tabReviewBtn" hidden>
            <div class="panel__head">
              <h2 class="panel__title" data-i18n="reviewTab">—</h2>
              <p class="panel__meta" id="reviewMeta">—</p>
            </div>
            <div class="groups" data-tab-group="review"></div>
            <div class="tab-empty" id="reviewEmpty" hidden>
              <p data-i18n="emptyReview">—</p>
            </div>
          </div>
          <div id="tabLocked" class="tab-panel" role="tabpanel" aria-labelledby="tabLockedBtn" hidden>
            <div class="panel__head">
              <h2 class="panel__title" data-i18n="lockedTab">—</h2>
              <p class="panel__meta" id="lockedMeta">—</p>
            </div>
            <div class="groups" data-tab-group="locked"></div>
            <div class="tab-empty" id="lockedEmpty" hidden>
              <p data-i18n="emptyLocked">—</p>
            </div>
          </div>
        </div>
      </section>

      <section class="state state--scan" id="scanState">
        <div class="radar" aria-hidden="true">
          <span class="radar__sweep"></span>
          <span class="radar__core"></span>
        </div>
        <p class="state__title" id="scanTitle">—</p>
        <p class="state__body" id="scanBody">—</p>
        <div class="progress" aria-hidden="true"><span class="progress__sweep"></span></div>
        <p class="state__clock" id="scanClock">—</p>
      </section>

      <section class="state state--empty" id="emptyState" hidden>
        <span class="state__mark"><svg aria-hidden="true"><use href="#i-mark" /></svg></span>
        <p class="state__title" id="emptyTitle">—</p>
        <p class="state__body" id="emptyBody">—</p>
      </section>

      <section class="state state--error" id="errorState" hidden>
        <span class="state__mark state__mark--blocked"><svg aria-hidden="true"><use href="#i-blocked" /></svg></span>
        <p class="state__title" id="errorTitle">—</p>
        <p class="state__body" id="errorBody">—</p>
        <button type="button" class="ghost" id="retryBtn"><span data-i18n="retry">—</span></button>
      </section>

      <section class="panel panel--result" id="result" aria-labelledby="resultTitle" hidden>
        <div class="panel__head">
          <h2 class="panel__title" id="resultTitle">—</h2>
          <p class="panel__meta" id="resultBody">—</p>
        </div>
        <div class="outcome">
          <div class="bezel">
            <div class="core core--outcome">
              <p class="figure__label" data-i18n="freed">—</p>
              <p class="figure__value figure__value--freed">
                <span id="freedValue">0</span><span class="figure__unit" id="freedUnit">GB</span>
              </p>
            </div>
          </div>
          <ul class="tally">
            <li><span data-i18n="deleted">—</span><b id="outDeleted">0</b></li>
            <li><span data-i18n="skipped">—</span><b id="outSkipped">0</b></li>
            <li><span data-i18n="failed">—</span><b id="outFailed">0</b></li>
            <li><span data-i18n="freeNow">—</span><b id="outFree">—</b></li>
          </ul>
        </div>
      </section>
    </main>

    <footer class="foot">
      <p data-i18n="footerNote">—</p>
      <p class="foot__meta"><span data-i18n="platform">—</span>: <b id="platformValue">—</b></p>
    </footer>

    <dialog class="sheet" id="confirm" aria-labelledby="confirmTitle">
      <form method="dialog" class="sheet__form">
        <header class="sheet__head">
          <h2 class="sheet__title" id="confirmTitle" data-i18n="confirmTitle">—</h2>
          <p class="sheet__body" id="confirmBody" data-i18n="confirmBody">—</p>
          <p class="sheet__summary">
            <span id="confirmSelectedCount">—</span>
            <span class="sheet__sep" aria-hidden="true"></span>
            <span id="confirmLockedCount">—</span>
            <span class="sheet__sep" aria-hidden="true"></span>
            <span id="confirmTotal">—</span>
          </p>
        </header>
        <div class="sheet__list" id="confirmList"></div>
        <footer class="sheet__actions">
          <button type="submit" value="cancel" class="ghost" id="confirmCancel" data-i18n="confirmCancel">—</button>
          <button type="submit" value="confirm" class="cta cta--compact" id="confirmGo" disabled>
            <span class="cta__body"><span class="cta__label" data-i18n="confirmGo">—</span></span>
            <span class="cta__icon"><svg aria-hidden="true"><use href="#i-broom" /></svg></span>
          </button>
        </footer>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
